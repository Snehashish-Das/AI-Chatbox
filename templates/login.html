<!DOCTYPE html>
<html>
<head>
    <title>Login - Gemini AI Chat</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #121212;
            --card-bg: #1e1e1e;
            --border-color: #333;
            --text-primary: #f5e2e2; 
            --accent-color: #0d6efd;
        }
        
        body {
            background-color: var(--bg-dark);
            color: var(--text-primary); 
            background-image: radial-gradient(circle at 25% 25%, rgba(13, 110, 253, 0.1) 0%, transparent 50%);
        }
        
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
            overflow: hidden;
        }
        
        .card-header {
            background: rgba(13, 110, 253, 0.1);
            border-bottom: 1px solid var(--border-color);
            padding: 1.5rem;
            text-align: center;
        }
        
        .form-control {
            background-color: #2d2d2d;
            border: 1px solid #444;
            color: var(--text-primary);
            border-radius: 8px;
            transition: all 0.3s ease;
            padding: 0.75rem 1rem;
        }
        
        .form-control:focus {
            background-color: #2d2d2d;
            color: var(--text-primary);
            border-color: var(--accent-color);
            box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.25);
        }
        
        .btn-primary {
            background-color: var(--accent-color);
            border-color: var(--accent-color);
            padding: 0.75rem;
            font-weight: 500;
            transition: all 0.2s ease;
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(13, 110, 253, 0.3);
        }
        
        .btn-primary:active {
            transform: translateY(0);
        }
        
        a {
            color: #4dabf7;
            text-decoration: none;
            transition: color 0.2s ease;
        }
        
        a:hover {
            color: #6cb2ff;
        }
        
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        
        .card-body {
            padding: 2rem;
        }

        ::placeholder {
        color: #ccc !important;
        opacity: 1;
        }

        input, small, .form-control, .card-body, .card-header {
        color: var(--text-primary) !important;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="card shadow-lg" style="width: 100%; max-width: 400px;">
            <div class="card-header">
                <h3 class="mb-0">🔐 Login to Gemini AI</h3>
            </div>
            <div class="card-body">
                <form method="post">
                    <div class="mb-3">
                        <input name="username" class="form-control" placeholder="Username" required>
                    </div>
                    <div class="mb-3">
                        <input name="password" type="password" class="form-control" placeholder="Password" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 mb-3">Log In</button>
                    <div class="text-center">
                        <small>Don't have an account? <a href="{{ url_for('signup') }}">Sign up</a></small>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
